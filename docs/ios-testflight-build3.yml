# JANKeN PoN iOS TestFlight Build 3
# ============================================================
# Build 3（音の修正・CPU 7/5/3/2秒・特大のレイアウト・手ごとの勝率・
# ランキングの色凡例・勝率5戦以上）用のワークフロー。トモアキさんが Safari で
# GitHub に貼り付ける用。
#
#   .github/workflows/ios-testflight-build2.yml
#   （いま GitHub にあるワークフローは、この Build 3 版に貼り替えても
#     貼り替えなくても、どちらでも Build 3 を配信できます。pbxproj の
#     CURRENT_PROJECT_VERSION を 3 にした時点で、番号は自動で 3 になります）
#
# GitHub連携の権限ではワークフローファイルを直接 push できないため、
# このファイルの中身をそのままコピーして上に貼ってください（DOROKEI と同じ手順）。
# 1行目は必ず「# 」で始まる YAML コメントのままにしてください。
#
# 使い方:
#   Actions →「JANKeN PoN iOS TestFlight」→ Run workflow
#     - confirm_bundle_id に `jp.signlink.JankenPon`
#     - upload_to_testflight は true（TestFlight へ配信）
#
# ★ ビルド番号はこのファイルに書きません。
#   ios/App/App.xcodeproj/project.pbxproj の CURRENT_PROJECT_VERSION を
#   そのまま読み取って使います（MARKETING_VERSION も同じ）。
#   Build 3 にするときは pbxproj の番号を上げるだけで、ワークフローは
#   書き換えなくて済みます。preflight は、pbxproj の2箇所の番号が
#   揃っていること・正の整数であることを確かめてから先へ進みます。
#
# 必要な Secrets（既存リポジトリと同じ値）:
#   APPLE_TEAM_ID                   … 例 TGBNH8WJV6
#   APPSTORE_CONNECT_KEY_ID         … App Store Connect API キーの Key ID（ASC_API_KEY_ID でも可）
#   APPSTORE_CONNECT_ISSUER_ID      … Issuer ID（ASC_API_ISSUER_ID でも可）
#   APPSTORE_CONNECT_PRIVATE_KEY    … AuthKey_*.p8 の中身（ASC_API_KEY_P8 でも可）
# ============================================================

name: JANKeN PoN iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm_bundle_id:
        description: "確認のため bundle ID を入力: jp.signlink.JankenPon"
        required: true
        type: string
        default: "jp.signlink.JankenPon"
      upload_to_testflight:
        description: "TestFlight へアップロードする（false = 署名済みIPAの作成まで）"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: janken-pon-ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: jp.signlink.JankenPon
  APP_NAME: JANKeN PoN
  PBXPROJ: ios/App/App.xcodeproj/project.pbxproj

jobs:
  preflight:
    name: Web preflight（テストと構成チェック）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm run intent
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm_bundle_id }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "$BUNDLE_ID"

      # ここでビルド番号と表示バージョンを iOS プロジェクトから読む（固定文字列を持たない）
      - name: Read the build number from the iOS project
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PBXPROJ" | sed -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/')
          MARKETING_VERSION=$(grep -m1 -E 'MARKETING_VERSION = [0-9.]+;' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          test -n "$BUILD_NUMBER" || { echo "::error::pbxproj に CURRENT_PROJECT_VERSION がありません"; exit 1; }
          test -n "$MARKETING_VERSION" || { echo "::error::pbxproj に MARKETING_VERSION がありません"; exit 1; }
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "ビルド番号: $BUILD_NUMBER / 表示バージョン: $MARKETING_VERSION"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run the JANKeN PoN rule, online and Build tests
        run: npm test

      - name: Guard the shipped game files
        run: |
          set -euo pipefail
          node --check src/core.js
          node --check src/countries.js
          node --check src/ranking.js
          node --check src/storage.js
          node --check src/audio.js
          node --check src/i18n.js
          node --check src/pro.js
          node --check src/online.js
          node --check src/main.js
          # クラシック一本（特殊ルールは UI に出さない）
          grep -q "ACTIVE_RULESETS = Object.freeze(\['standard'\])" src/core.js
          ! grep -q 'id="mode-grid"' index.html
          grep -q 'CLASSIC' index.html
          # 通信は1手5秒・マッチング30秒
          grep -q 'ONLINE_TURN_MS = 5000' src/core.js
          grep -q 'MATCH_TIMEOUT_MS = 30000' src/core.js
          # パーティーは 2〜4人・5回戦・ランキング非加算
          grep -q 'PARTY_ROUNDS = 5' src/core.js
          grep -q 'PARTY_COUNTS_FOR_RANKING = false' src/core.js
          grep -q 'export function scorePartyRound' src/core.js
          # 無料/PRO の線引きと商品ID・フォールバック価格（¥300）
          grep -q "PRODUCT_ID = 'jp.signlink.JankenPon.pro'" src/pro.js
          grep -q 'export function canPlayWorld' src/pro.js
          grep -q '¥300' src/pro.js
          # 12言語
          grep -q 'zh-Hant' src/i18n.js
          grep -q 'Bahasa Indonesia' src/i18n.js
          # 安全（自由入力なし・定型スタンプ・長押し抑止）
          ! grep -qi '<textarea' index.html
          grep -q 'validateOnlinePick' src/online.js
          grep -q -- '-webkit-touch-callout' styles.css
          # Supabase games-realtime
          grep -q 'siivncidktbuyqwsjeqd.supabase.co' src/online.js
          grep -q 'janken-quick' src/online.js
          grep -q 'janken-party' src/online.js
          # アイコン（1024・RGB・透過なし）
          test -f assets/janken-appicon-1024.png
          python3 - <<'PY'
          import struct, pathlib
          for path in ['assets/janken-appicon-1024.png',
                       'ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png']:
              data = pathlib.Path(path).read_bytes()
              assert data[:4] == b'\x89PNG', path
              width, height = struct.unpack('>II', data[16:24])
              depth, color = data[24], data[25]
              assert (width, height) == (1024, 1024), (path, width, height)
              assert (depth, color) == (8, 2), (path, depth, color)  # RGB, no alpha
          print('icons OK')
          PY
          # 配布用 www が作れる
          node tools/make-www.mjs
          test -f www/index.html
          test -f www/src/main.js
          test -f www/src/online.js
          echo "JANKeN PoN web assets OK"

      - name: Guard the Build 2 and 3 features
        run: |
          set -euo pipefail
          # 1) セーフエリア（ノッチ・カメラ・ホームインジケータを避ける）
          grep -q 'viewport-fit=cover' index.html
          grep -q 'env(safe-area-inset-top' styles.css
          grep -q -- '--safe-t' styles.css
          grep -q -- '-webkit-overflow-scrolling: touch' styles.css
          # 2) 文字サイズ設定（標準 / 大 / 特大）
          grep -q 'data-text-size' index.html
          grep -q 'TEXT_SCALES' src/storage.js
          grep -q 'calc(.*px \* var(--ts))' styles.css
          # 3) サウンド ON/OFF（マスターを 0 にする）
          grep -q 'rampMaster' src/audio.js
          grep -q 'AVAudioSession' ios/App/App/AppDelegate.swift
          # 4) 国籍は初回登録後ロック・ニックネームは変更可
          grep -q 'countryLocked' src/storage.js
          grep -q 'registerCountry' src/main.js
          grep -q 'settings.nickname' index.html
          # 5) 自分（YOU）が左・相手が右
          python3 - <<'PY'
          import pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          you = html.index('id="you-pod"')
          cpu = html.index('id="cpu-pod"')
          assert you < cpu, 'YOU のカードが相手より先（＝左）にあること'
          print('left = YOU (you-pod before cpu-pod)')
          PY
          grep -q 'stamp-bubble--you { left' styles.css
          # 6) 週間ランキング
          grep -q "id: 'weekly'" src/ranking.js
          grep -q 'weeklyPoints' src/ranking.js
          grep -q 'weekly' src/storage.js
          # 7) PK戦風の履歴ボード
          grep -q 'export function pkBoard' src/core.js
          grep -q 'id="pks-cells"' index.html
          grep -q 'renderPk' src/main.js
          # 8) かけ声切替（自分の国 ⇄ 相手の国）
          grep -q 'export function nextChantSide' src/core.js
          grep -q 'id="btn-chant-toggle"' index.html
          grep -q 'toggleChantSide' src/main.js
          # 9) Build 3: iOS で音が鳴る（Audio Session を playback に・無音 audio で下支え）
          grep -q "navigator.audioSession" src/audio.js
          grep -q "audioSession.type" src/audio.js
          grep -q "SILENT_WAV" src/audio.js
          grep -q "createBufferSource" src/audio.js
          grep -q 'jsName = "JankenAudio"' ios/App/App/AppDelegate.swift
          grep -q "activateAudioSession" ios/App/App/AppDelegate.swift
          grep -q "registerPluginInstance(JankenAudioPlugin())" ios/App/App/AppDelegate.swift
          # 10) CPU 練習の秒数（初級7 / 中級5 / 上級3 / 最強2）
          grep -q "thinkingTimeMs: 7000" src/core.js
          grep -q "thinkingTimeMs: 5000" src/core.js
          grep -q "thinkingTimeMs: 3000" src/core.js
          grep -q "thinkingTimeMs: 2000" src/core.js
          # 11) 特大のレイアウト（回戦数 / CPUの強さ・チョキの折り返し）
          grep -q "white-space: nowrap; flex: 0 1 auto" styles.css
          grep -q "grid-template-columns: 20px auto minmax(40px, 1fr)" styles.css
          grep -q "timer__hint" styles.css
          # 12) その手ごとの勝率・ランキングの凡例・勝率は5戦以上
          grep -q "handResults" src/storage.js
          grep -q "export function handWinRate" src/storage.js
          grep -q "handrow__win" src/main.js
          grep -q 'id="rank-legend"' index.html
          grep -q "MIN_WINRATE_MATCHES = 5" src/ranking.js
          grep -q "rank-note" index.html
          # ビルド表記
          grep -q "build: $BUILD_NUMBER" src/main.js
          grep -q "(Build $BUILD_NUMBER)" index.html
          echo "Build 2 features OK (build $BUILD_NUMBER)"

      - name: Guard the iOS project contract
        run: |
          set -euo pipefail
          test -f "$PBXPROJ"
          test -f ios/App/App/Info.plist
          test -f ios/App/App/AppDelegate.swift
          test -f ios/App/App/SceneDelegate.swift
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          test -f ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          test ! -d ios/App/App/public
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = jp.signlink.JankenPon;' "$PBXPROJ"
          grep -q "CURRENT_PROJECT_VERSION = $BUILD_NUMBER;" "$PBXPROJ"
          grep -q 'import StoreKit' ios/App/App/AppDelegate.swift
          grep -q 'jsName = "StoreKit"' ios/App/App/AppDelegate.swift
          grep -q 'jp.signlink.JankenPon.pro' ios/App/App/AppDelegate.swift
          grep -q 'JankenBridgeViewController' ios/App/App/SceneDelegate.swift
          python3 - <<'PY'
          import os, plistlib, pathlib, re
          plist = plistlib.loads(pathlib.Path('ios/App/App/Info.plist').read_bytes())
          assert plist['CFBundleDisplayName'] == 'JANKeN PoN', plist['CFBundleDisplayName']
          pbx = pathlib.Path(os.environ['PBXPROJ']).read_text()
          assert 'PRODUCT_BUNDLE_IDENTIFIER = jp.signlink.JankenPon;' in pbx
          numbers = [int(n) for n in re.findall(r'CURRENT_PROJECT_VERSION = (\d+);', pbx)]
          assert len(numbers) == 2, f'ビルド番号は2箇所（Debug/Release）: {numbers}'
          assert len(set(numbers)) == 1, f'2箇所のビルド番号が違います: {numbers}'
          assert numbers[0] == int(os.environ['BUILD_NUMBER']), 'pbxproj と解決したビルド番号が違います'
          assert re.search(r'MARKETING_VERSION = [0-9.]+;', pbx), 'MARKETING_VERSION がありません'
          print('iOS project contract OK (build %s)' % os.environ['BUILD_NUMBER'])
          PY

  testflight:
    name: Xcode で署名 → IPA → TestFlight
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID || secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY || secrets.ASC_API_KEY_P8 }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the build number from the iOS project
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PBXPROJ" | sed -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/')
          MARKETING_VERSION=$(grep -m1 -E 'MARKETING_VERSION = [0-9.]+;' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          test -n "$BUILD_NUMBER"
          test -n "$MARKETING_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "ビルド番号: $BUILD_NUMBER / 表示バージョン: $MARKETING_VERSION"

      - name: Verify Apple secret contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEAM_ID" || { echo "::error::APPLE_TEAM_ID が未設定です"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "::error::APPSTORE_CONNECT_KEY_ID（または ASC_API_KEY_ID）が未設定です"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::APPSTORE_CONNECT_ISSUER_ID（または ASC_API_ISSUER_ID）が未設定です"; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "::error::APPSTORE_CONNECT_PRIVATE_KEY（または ASC_API_KEY_P8）が未設定です"; exit 1; }
          echo "Secrets present."

      - name: Xcode environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write the App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          export AUTH_KEY_PATH
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ["ASC_PRIVATE_KEY"]
          value = value.lstrip("\ufeff").replace("\r\n", "\n").replace("\r", "\n").strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
              value = value[1:-1].strip()
          if "\\n" in value and "\n" not in value:
              value = value.replace("\\n", "\n")
          if "-----BEGIN" not in value:
              try:
                  decoded = base64.b64decode("".join(value.split()), validate=True).decode("utf-8")
                  if "-----BEGIN" in decoded:
                      value = decoded.strip()
              except Exception:
                  pass
          Path(os.environ["AUTH_KEY_PATH"]).write_text(value + "\n", encoding="utf-8")
          PY
          chmod 600 "$AUTH_KEY_PATH"
          if ! openssl pkey -in "$AUTH_KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::ASC_PRIVATE_KEY が正しい .p8（PEM秘密鍵）ではありません。AuthKey_*.p8 の中身を丸ごとコピーしてください。"
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build www and sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node tools/make-www.mjs
          npx cap sync ios
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/src/main.js
          test -f ios/App/App/public/src/online.js
          test -f ios/App/App/public/src/i18n.js
          test -f ios/App/App/public/src/pro.js
          test -f ios/App/App/public/assets/janken-appicon-1024.png
          grep -q 'JANKeN PoN' ios/App/App/public/index.html
          grep -q 'safe-area-inset-top' ios/App/App/public/styles.css
          echo "Capacitor sync OK"

      - name: Archive (Xcode cloud signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/release/JANKeNPoN.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive | tee build/release/archive.log

      - name: Prove the PRO plugin is in the binary
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/release/JANKeNPoN.xcarchive/Products/Applications/App.app/App"
          test -f "$APP"
          strings "$APP" | grep -q "jp.signlink.JankenPon.pro" \
            || { echo "::error::PRO の商品IDがバイナリに入っていません"; exit 1; }
          strings "$APP" | grep -q "JankenAudio" \
            || { echo "::error::音のブリッジ（JankenAudio）がバイナリに入っていません"; exit 1; }
          echo "StoreKit product id and JankenAudio bridge present in the binary"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/release/JANKeNPoN.xcarchive" \
            -exportPath "$PWD/build/release/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/release/export.log
          IPA_PATH=$(find "$PWD/build/release/export" -maxdepth 1 -name "*.ipa" -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA_PATH" | tee build/release/IPA_SHA256.txt

      - name: Validate the IPA with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee build/release/altool-validate.json

      - name: Upload to TestFlight
        if: ${{ env.UPLOAD == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee build/release/altool-upload.json

      - name: Keep the build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janken-pon-testflight-build3-evidence
          path: |
            build/release/*.log
            build/release/*.json
            build/release/IPA_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
